<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cronômetro Interativo</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Cronômetro Interativo</h1>
    <div id="status" aria-label="Status do cronômetro">Pausado</div>
    <div class="timer-container"> 

      <!-- Visor principal onde o tempo é mostrado (min:seg.centésimos) -->
      <div id="clock" aria-label="Tempo atual do cronômetro">
        <h2 id="time-display">00:00.00</h2>
      </div>
      <div class="controls">
        <!-- Botão para iniciar ou pausar o cronômetro -->
        <button id="start-stop" onclick="startStopTimer()">Iniciar</button>
        <!-- Botão para resetar o tempo e limpar as voltas -->
        <button id="clean" onclick="resetTimer()">Reiniciar</button>
      </div>

      <!-- Área que gerencia as voltas (laps) -->
      <div id="lap-container">

        <!-- Botão para adicionar uma nova volta -->
        <button id="lap-btn" onclick="addLap()">Adicionar Volta</button>

        <!-- Lista onde cada volta registrada é exibida -->
        <ul id="lap-list" aria-label="Lista de voltas"></ul>
      </div>
    </div>
  </div>

  <!-- Importa o JavaScript que contém toda a lógica do cronômetro -->
  <script src="script.js"></script>
</body>
</html>
